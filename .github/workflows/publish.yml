name: Publish to VS Code Marketplace

# Single publisher. Fires when a version tag (v1.2.3) is pushed — either
# by hand or by the Release workflow. Builds, publishes to the Marketplace
# and creates a GitHub Release with the packaged VSIX attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit

      # vsce runs the `vscode:prepublish` script (npm run build) automatically.
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out "effective-config-${{ github.ref_name }}.vsix"

      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce publish --packagePath "effective-config-${{ github.ref_name }}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.vsix"
